name: Fix Shopify live data load
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Shopify live data load race'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend data loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''  useEffect(()=>{refreshSources()},[]);
  useEffect(()=>{if(active==="Dashboard"||active==="Sales"||active==="Data"||active==="Finance") refreshLive(active)},[active]);

  async function refreshSources(){
    try{const r=await fetch("/api/connectors",{cache:"no-store"});const j=await r.json();if(Array.isArray(j.data))setSources(j.data)}catch{}
  }

  async function refreshLive(view:string){
    if(view!=="Dashboard"&&view!=="Sales"&&view!=="Data"&&view!=="Finance")return;
    setSyncing(true);
    try{
      const connected=sources.filter(s=>s.status==="connected").slice(0,10);'''
          new = '''  useEffect(()=>{refreshSourcesAndLive()},[]);
  useEffect(()=>{if(active==="Dashboard"||active==="Sales"||active==="Data"||active==="Finance") refreshLive(active,sources)},[active]);

  async function refreshSourcesAndLive(){
    try{
      const r=await fetch("/api/connectors",{cache:"no-store"});
      const j=await r.json();
      if(Array.isArray(j.data)){
        setSources(j.data);
        await refreshLive("Dashboard",j.data);
      }
    }catch{}
  }

  async function refreshSources(){
    try{const r=await fetch("/api/connectors",{cache:"no-store"});const j=await r.json();if(Array.isArray(j.data))setSources(j.data)}catch{}
  }

  async function refreshLive(view:string, sourceList:Source[]=sources){
    if(view!=="Dashboard"&&view!=="Sales"&&view!=="Data"&&view!=="Finance")return;
    setSyncing(true);
    try{
      const connected=sourceList.filter(s=>s.status==="connected").slice(0,10);'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Shopify live data load race"
          git push
